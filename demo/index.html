<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>prosemirror-beltype demo</title>
  <style>
    @page { size: A5; margin: 18mm 16mm 20mm; @bottom-center { content: counter(page) " / " counter(pages); font: 9pt system-ui, sans-serif; } }
    html { line-height: 1.4; }
    html, body { margin: 0; background: #e8e6e1; }
    #status { font: 13px system-ui, sans-serif; padding: 8px 16px; }
    #editor { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    h1 { font: 600 20pt/1.2 Georgia, serif; margin: 0 0 12pt; }
    h2 { font: 600 14pt/1.3 Georgia, serif; margin: 14pt 0 6pt; break-after: avoid; }
    p { font: 10.5pt/1.45 Georgia, serif; margin: 0 0 6pt; text-align: justify; hyphens: auto; }
  </style>
  <script type="module" src="./main.js"></script>
</head>

  <div id="status">Loading…</div>
  <div id="editor"></div>
