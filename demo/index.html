<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>prosemirror-beltype demo</title>
  <style>
    /* The book: A5, folios in the outer corners, the chapter's title in the running head, a title page that wears nothing. */
    @page { size: A5; margin: 20mm 18mm 22mm;
      @bottom-right { content: counter(page); font: 8.5pt Georgia, serif; color: #6b665e; }
      @top-right { content: string(chapter); font: italic 8.5pt Georgia, serif; color: #6b665e; }
    }
    @page :left {
      @bottom-left { content: counter(page); font: 8.5pt Georgia, serif; color: #6b665e; }
      @bottom-right { content: none; }
      @top-left { content: "On the making of pages"; font: italic 8.5pt Georgia, serif; color: #6b665e; }
      @top-right { content: none; }
    }
    @page cover { @top-left { content: none; } @top-right { content: none; } @bottom-left { content: none; } @bottom-right { content: none; } }
    html { line-height: 1.4; }
    body { counter-reset: chapter; }
    .book-title { page: cover; font: 600 26pt/1.15 Georgia, serif; margin: 52mm 0 6mm; text-align: left; hyphens: manual; }
    .book-subtitle { page: cover; font: italic 12pt/1.4 Georgia, serif; color: #4a463f; margin: 0; break-after: page; }
    h1 { counter-increment: chapter; string-set: chapter content(); break-before: page; font: 600 18pt/1.2 Georgia, serif; margin: 18mm 0 10pt; }
    h1::before { content: "Chapter " counter(chapter, upper-roman); display: block; font: italic 10pt/1.4 Georgia, serif; color: #6b665e; margin-bottom: 4pt; }
    h2 { font: 600 12pt/1.3 Georgia, serif; margin: 12pt 0 4pt; break-after: avoid; }
    p { font: 10.5pt/1.45 Georgia, serif; margin: 0; text-align: justify; hyphens: auto; orphans: 2; widows: 2; }
    p + p { text-indent: 1.2em; }
    .book-subtitle { text-indent: 0; text-align: left; }
    blockquote { margin: 8pt 1.4em; font-style: italic; break-inside: avoid; }
    blockquote p { text-indent: 0; }
    ol, ul { margin: 6pt 0 6pt 1.4em; padding: 0; font: 10.5pt/1.45 Georgia, serif; }
    li p { text-indent: 0; text-align: left; }
    /* The interface: a desk, and pages that sit on it. Shadows and gaps only, nothing that changes a page's own size. */
    html, body { margin: 0; background: #ecebe7; }
    #status { position: sticky; top: 0; z-index: 1; font: 12px system-ui, sans-serif; color: #5f5b54; padding: 10px 20px; background: rgb(236 234 230 / .9); backdrop-filter: blur(6px); border-bottom: 1px solid rgb(0 0 0 / .06); }
    #editor { padding: 40px 16px 24px; }
    #editor .fragview { outline: none; }
    #editor beltype-page { margin: 0 auto 40px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .04), 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px -6px rgb(0 0 0 / .12); }
  </style>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="editor"></div>
</body>
</html>
