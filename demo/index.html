<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>prosemirror-beltype demo</title>
  <style>
    @page { size: A5; margin: 18mm 16mm 20mm; @bottom-center { content: counter(page) " / " counter(pages); font: 9pt system-ui, sans-serif; } }
    html { line-height: 1.4; }
    html, body { margin: 0; background: #ecebe7; }
    /* The interface: a desk, and pages that sit on it. Shadows and gaps only, nothing that changes a page's own size. */
    #status { position: sticky; top: 0; z-index: 1; font: 12px system-ui, sans-serif; color: #5f5b54; padding: 10px 20px; background: rgb(236 234 230 / .9); backdrop-filter: blur(6px); border-bottom: 1px solid rgb(0 0 0 / .06); }
    #editor { padding: 40px 16px 24px; }
    #editor beltype-page { margin: 0 auto 40px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px rgb(0 0 0 / .04), 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px -6px rgb(0 0 0 / .12); }
    h1 { font: 600 20pt/1.2 Georgia, serif; margin: 0 0 12pt; }
    h2 { font: 600 14pt/1.3 Georgia, serif; margin: 14pt 0 6pt; break-after: avoid; }
    p { font: 10.5pt/1.45 Georgia, serif; margin: 0 0 6pt; text-align: justify; hyphens: auto; }
  </style>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="editor"></div>
</body>
</html>
